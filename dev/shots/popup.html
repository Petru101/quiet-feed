<html>

<head>
  <meta charset="utf-8">
  <title>Popup for screenshots</title>
  <!-- Resolve everything against src/, so the real popup's own relative
       paths (its icon, its scripts) work unchanged. -->
  <base href="../../src/">
</head>

<body>
  <script src="../dev/shots/stub.js"></script>
  <script>
    /* The real popup markup and scripts, as in dev/ui-check.html. */
    function load(src) {
      return new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = reject;
        document.body.appendChild(s);
      });
    }

    fetch('popup.html').then(function (r) { return r.text(); }).then(function (html) {
      var doc = new DOMParser().parseFromString(html, 'text/html');
      document.head.insertAdjacentHTML('beforeend', doc.head.innerHTML);
      document.body.insertAdjacentHTML('beforeend', doc.body.innerHTML);   // its <script>s stay inert
      return load('common.js');
    }).then(function () {
      return load('popup.js');
    }).then(function () {
      // The popup focuses its input on open; a focus ring reads as clutter in a still.
      [300, 1200].forEach(function (ms) {
        setTimeout(function () { if (document.activeElement) document.activeElement.blur(); }, ms);
      });
    });
  </script>
</body>

</html>
